"$schema" = "schemas/schema.json"

[default]
description = "Lets Aurora's own pages drive the Android playback service and read audio outputs."
permissions = ["allow-player"]

[[permission]]
identifier = "allow-player"
description = "Phone music, song analysis for transitions (waveforms, silence), picking images and backup files, playback queue and transport, audio output, plays made while the app was closed, and their events."
commands.allow = [
  "queue",
  "control",
  "state",
  "outputs",
  "output",
  "plays",
  "reload",
  "musicAccess",
  "musicFolder",
  "vizStart",
  "vizStop",
  "peaks",
  "bounds",
  "phoneFolders",
  "pickImage",
  "createDocument",
  "openDocument",
  "register_listener",
  "registerListener",
  "remove_listener",
  "removeListener",
]
