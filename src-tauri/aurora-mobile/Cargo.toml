[package]
name = "tauri-plugin-aurora-mobile"
version = "0.1.0"
edition = "2021"
description = "Aurora's Android side: playback service (background, lock screen, Android Auto), audio outputs and downloads."
links = "tauri-plugin-aurora-mobile"
publish = false

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
