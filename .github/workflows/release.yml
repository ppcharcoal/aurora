# Builds the Windows installer, the Linux packages (Electron: AppImage, .deb and an Arch
# PKGBUILD) and the Android app, and attaches them all to a GitHub Release. Start it by pushing a version tag:
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# or from the repository's Actions tab → "Release" → "Run workflow".
# See docs/BUILDING.md → "Publish on GitHub" for the secrets it needs.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, e.g. v0.2.0"
        required: true
      only:
        description: "Build only these (any of: windows linux android)"
        required: false
        default: "windows linux android"

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    if: github.event_name == 'push' || contains(github.event.inputs.only, 'windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Last.fm key (optional)
        shell: bash
        env:
          LASTFM_KEY_JSON: ${{ secrets.LASTFM_KEY_JSON }}
        run: |
          if [ -n "$LASTFM_KEY_JSON" ]; then printf '%s' "$LASTFM_KEY_JSON" > src-tauri/lastfm-key.json; fi

      - run: npm ci
      - run: npm run app:build

      - name: Rename installer
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/Aurora-${TAG}-windows-setup.exe"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Aurora ${{ env.TAG }}
          draft: false
          prerelease: false
          make_latest: true
          files: out/*


  linux:
    # Electron app + Aurora's Rust helper (aurora-core). Built on the oldest
    # supported Ubuntu, so the .deb and AppImage run on older systems too.
    if: github.event_name == 'push' || contains(github.event.inputs.only, 'linux')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Errors are repeated as annotations (shown on the run's summary page).
      # WebKitGTK headers are only needed to compile; aurora-core doesn't use it.
      - name: System libraries
        run: |
          sudo apt-get update -q || true
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            file libssl-dev pkg-config build-essential > /tmp/apt.log 2>&1 \
            || { tail -n 20 /tmp/apt.log | sed 's/^/::error::/'; exit 1; }

      - name: Last.fm key (optional)
        env:
          LASTFM_KEY_JSON: ${{ secrets.LASTFM_KEY_JSON }}
        run: |
          if [ -n "$LASTFM_KEY_JSON" ]; then printf '%s' "$LASTFM_KEY_JSON" > src-tauri/lastfm-key.json; fi

      - name: Build aurora-core
        env:
          RUSTFLAGS: "-C link-arg=-Wl,--as-needed"
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin aurora-core --no-default-features --features core > /tmp/core.log 2>&1 \
            || { tail -n 30 /tmp/core.log | sed 's/^/::error::/'; exit 1; }
          if ldd src-tauri/target/release/aurora-core | grep -q webkit; then echo "::error::aurora-core links WebKitGTK"; exit 1; fi

      - name: Build the app
        run: |
          npm ci
          npx vite build --mode electron
          cd electron
          npm ci
          npm version --no-git-tag-version --allow-same-version "${TAG#v}"
          npx electron-builder --linux --publish never > /tmp/eb.log 2>&1 \
            || { tail -n 30 /tmp/eb.log | sed 's/^/::error::/'; exit 1; }
          tail -n 5 /tmp/eb.log

      - name: Rename, and make the Arch PKGBUILD
        run: |
          mkdir -p out
          cp electron/dist/*.deb "out/Aurora-${TAG}-linux-amd64.deb"
          cp electron/dist/*.AppImage "out/Aurora-${TAG}-linux-x86_64.AppImage"
          node scripts/arch-pkgbuild.mjs "${TAG#v}" "out/Aurora-${TAG}-linux-amd64.deb" out/PKGBUILD

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Aurora ${{ env.TAG }}
          draft: false
          prerelease: false
          make_latest: true
          files: out/*

  android:
    if: github.event_name == 'push' || contains(github.event.inputs.only, 'android')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # GitHub's Ubuntu machines come with the Android SDK; add the NDK version we build with.
      - name: Android SDK and NDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Last.fm key (optional)
        env:
          LASTFM_KEY_JSON: ${{ secrets.LASTFM_KEY_JSON }}
        run: |
          if [ -n "$LASTFM_KEY_JSON" ]; then printf '%s' "$LASTFM_KEY_JSON" > src-tauri/lastfm-key.json; fi

      - run: npm ci
      - name: Create the Android project
        run: npx tauri android init --ci && node scripts/android-setup.mjs

      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE and ANDROID_KEY_PASSWORD secrets (docs/BUILDING.md → Publish on GitHub)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > src-tauri/aurora-release.jks
          printf 'password=%s\n' "$ANDROID_KEY_PASSWORD" > src-tauri/gen/android/keystore.properties
          node scripts/android-signing.mjs

      - run: npm run android:build

      - name: Rename app
        run: |
          mkdir -p out
          cp src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk "out/Aurora-${TAG}-android.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Aurora ${{ env.TAG }}
          draft: false
          prerelease: false
          make_latest: true
          files: out/*
